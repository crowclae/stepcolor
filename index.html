<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>STEP Face Viewer</title>

    <link rel="stylesheet" href="./style.css" />

    <script type="importmap">
    {"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js"}}
    </script>

</head>

<body>

    <header id="topbar">

        <div class="title">
            STEP Face Viewer
        </div>

        <div class="controls" style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">

            <label class="file-button" style="padding: 4px 12px; background: #007acc; color: #fff; border-radius: 4px; cursor: pointer; font-size: 12px;">
                STEP Import
                <input
                    type="file"
                    id="stepFile"
                    accept=".step,.stp"
                    hidden
                />
            </label>

            <button id="undoButton" style="padding: 4px 12px; background: #444; color: #fff; border: 1px solid #666; border-radius: 4px; cursor: pointer; font-size: 12px;" title="1つ前の色付けに戻す">戻る</button>

            <div class="color-palette" style="display: flex; gap: 6px; align-items: center;">
                <button class="palette-btn" data-color="#ff0000" style="width: 24px; height: 24px; background: #ff0000; border: 1px solid #fff; border-radius: 4px; cursor: pointer;" title="赤"></button>
                <button class="palette-btn" data-color="#ffff00" style="width: 24px; height: 24px; background: #ffff00; border: 1px solid #fff; border-radius: 4px; cursor: pointer;" title="黄"></button>
                <button class="palette-btn" data-color="#0000ff" style="width: 24px; height: 24px; background: #0000ff; border: 1px solid #fff; border-radius: 4px; cursor: pointer;" title="青"></button>
                <button class="palette-btn" data-color="#008000" style="width: 24px; height: 24px; background: #008000; border: 1px solid #fff; border-radius: 4px; cursor: pointer;" title="緑"></button>
                <button class="palette-btn" data-color="#ffffff" style="width: 24px; height: 24px; background: #ffffff; border: 1px solid #ccc; border-radius: 4px; cursor: pointer;" title="白"></button>
                <button class="palette-btn" data-color="#000000" style="width: 24px; height: 24px; background: #000000; border: 1px solid #fff; border-radius: 4px; cursor: pointer;" title="黒"></button>
            </div>

            <input
                type="color"
                id="colorPicker"
                value="#ff0000"
                style="cursor: pointer;"
                title="カスタムカラー選択"
            />

            <div style="display: flex; align-items: center; gap: 6px; color: #fff; font-size: 12px; border-left: 1px solid #555; padding-left: 10px;">
                <span>曲率判定:</span>
                <button id="thresholdMinus" style="width: 20px; height: 20px; background: #444; color: #fff; border: 1px solid #666; border-radius: 3px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold;" title="5度減らす">−</button>
                
                <input type="range" id="thresholdSlider" min="0" max="90" step="5" value="15" style="cursor: pointer; width: 80px; margin: 0;" />
                
                <button id="thresholdPlus" style="width: 20px; height: 20px; background: #444; color: #fff; border: 1px solid #666; border-radius: 3px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold;" title="5度増やす">+</button>
                
                <span id="thresholdValue" style="min-width: 25px; text-align: right;">15°</span>
            </div>

            <div style="display: flex; align-items: center; gap: 6px; border-left: 1px solid #555; padding-left: 10px;">
                <button id="saveColorsButton" style="padding: 4px 12px; background: #28a745; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;" title="現在の色付け状態をJSONで保存してダウンロード">保存/DL</button>
                <label class="file-button" style="padding: 4px 12px; background: #17a2b8; color: #fff; border-radius: 4px; cursor: pointer; font-size: 12px;" title="過去に保存した色付けJSONファイルを読み込む">
                    カラー読込
                    <input
                        type="file"
                        id="importColorsFile"
                        accept=".json"
                        hidden
                    />
                </label>
            </div>

        </div>

    </header>

    <main id="viewer-container">

        <canvas id="viewer"></canvas>

        <div id="loading">
            Drop STEP File
        </div>

    </main>

    <aside id="info-panel">

        <div class="info-title">
            Selection
        </div>

        <div class="info-row">
            <span class="label">Face ID:</span>
            <span id="faceId">None</span>
        </div>

        <div class="info-row">
            <span class="label">Mesh:</span>
            <span id="meshName">None</span>
        </div>

    </aside>

    <script src="./occt-import-js.js"></script>

    <script type="module" src="./main.js"></script>

</body>
</html>
