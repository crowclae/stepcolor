<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>STEP Face Viewer</title>

    <link rel="stylesheet" href="./style.css" />

    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js"
      }
    }
    </script>

</head>

<body>

    <!-- ===================================================== -->
    <!-- Header -->
    <!-- ===================================================== -->

    <header id="topbar">

        <div class="title">
            STEP Face Viewer
        </div>

    <div class="controls">
    
        <label class="file-button">
            STEP Import
            <input type="file" id="stepFile" accept=".step,.stp" hidden />
        </label>
    
        <button id="undoButton" style="padding: 4px 12px; background: #444; color: #fff; border: 1px solid #666; border-radius: 4px; cursor: pointer; font-size: 12px; margin-right: 10px;" title="1つ前の色付けに戻す">戻る</button>
    
        <div class="color-palette" style="display: flex; gap: 6px; align-items: center; margin-right: 10px;">
            <button class="palette-btn" data-color="#ff0000" style="width: 24px; height: 24px; background: #ff0000; border: 1px solid #fff; border-radius: 4px; cursor: pointer;" title="赤"></button>
            <button class="palette-btn" data-color="#ffff00" style="width: 24px; height: 24px; background: #ffff00; border: 1px solid #fff; border-radius: 4px; cursor: pointer;" title="黄"></button>
            <button class="palette-btn" data-color="#0000ff" style="width: 24px; height: 24px; background: #0000ff; border: 1px solid #fff; border-radius: 4px; cursor: pointer;" title="青"></button>
            <button class="palette-btn" data-color="#008000" style="width: 24px; height: 24px; background: #008000; border: 1px solid #fff; border-radius: 4px; cursor: pointer;" title="緑"></button>
            <button class="palette-btn" data-color="#ffffff" style="width: 24px; height: 24px; background: #ffffff; border: 1px solid #ccc; border-radius: 4px; cursor: pointer;" title="白"></button>
            <button class="palette-btn" data-color="#000000" style="width: 24px; height: 24px; background: #000000; border: 1px solid #fff; border-radius: 4px; cursor: pointer;" title="黒"></button>
        </div>
    
        <input type="color" id="colorPicker" value="#ff0000" style="margin-right: 15px;" title="カスタムカラー選択" />
    
        <div style="display: flex; align-items: center; gap: 8px; color: #fff; font-size: 12px;">
            <span>曲率判定:</span>
            <input type="range" id="thresholdSlider" min="0" max="90" step="5" value="15" style="cursor: pointer; width: 100px;" />
            <span id="thresholdValue" style="min-width: 25px; text-align: right;">15°</span>
        </div>
    
    </div>

    </header>

    <!-- ===================================================== -->
    <!-- Viewer -->
    <!-- ===================================================== -->

    <main id="viewer-container">

        <!-- Three.js Canvas -->

        <canvas id="viewer"></canvas>

        <!-- Loading -->

        <div id="loading">

            Drop STEP File

        </div>

    </main>

    <!-- ===================================================== -->
    <!-- Info Panel -->
    <!-- ===================================================== -->

    <aside id="info-panel">

        <div class="info-title">

            Selection

        </div>

        <div class="info-row">

            <span class="label">
                Face ID:
            </span>

            <span id="faceId">
                None
            </span>

        </div>

        <div class="info-row">

            <span class="label">
                Mesh:
            </span>

            <span id="meshName">
                None
            </span>

        </div>

    </aside>

    <!-- ===================================================== -->
    <!-- Scripts -->
    <!-- ===================================================== -->

    <!-- OpenCascade WASM -->

    <script src="./occt-import-js.js"></script>

    <!-- Main -->

    <script type="module" src="./main.js"></script>

</body>

</html>
